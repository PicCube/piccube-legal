<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PicCube Legal</title>
  <style>
:root {
  --ink: #1F2A32;
  --ink-soft: #4A5A64;
  --foam: #E8F9F8;
  --aqua: #2A9AAA;
  --pink: #E85A9A;
  --card: rgba(255,255,255,0.78);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Nunito Sans", "Nunito", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: linear-gradient(165deg, #E8F9F8 0%, #C5F0EE 45%, #DFF7F6 100%);
  min-height: 100vh;
  line-height: 1.55;
}
header {
  padding: 28px 20px 12px;
  text-align: center;
}
header a.brand {
  font-weight: 800;
  font-size: 1.35rem;
  color: var(--aqua);
  text-decoration: none;
}
main {
  max-width: 720px;
  margin: 0 auto 48px;
  padding: 0 16px;
}
.card {
  background: var(--card);
  border-radius: 18px;
  padding: 22px 20px 28px;
  box-shadow: 0 10px 28px rgba(42,154,170,0.14);
}
h1, h2, h3 { color: var(--ink); line-height: 1.25; }
h1 { font-size: 1.75rem; margin-top: 0; }
h2 { font-size: 1.25rem; margin-top: 1.6em; }
p, li { color: var(--ink); }
a { color: var(--pink); }
.nav {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 8px 0 18px;
}
.nav a {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 999px;
  background: white;
  color: var(--aqua);
  text-decoration: none;
  font-weight: 700;
  font-size: 0.9rem;
}
footer {
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.85rem;
  padding: 0 16px 40px;
}
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
th, td { border-bottom: 1px solid rgba(31,42,50,0.12); padding: 8px 6px; text-align: left; }
</style>
</head>
<body>
  <header>
    <a class="brand" href="./">PicCube</a>
  </header>
  <main>
    <article class="card">
      <h1>Legal</h1>
      <p>Official Terms of Service and Privacy Policy for the PicCube iOS app.</p>
      <div class="nav">
        <a href="./piccube/terms/">Terms of Service</a>
        <a href="./piccube/privacy/">Privacy Policy</a>
      </div>
    </article>
  </main>
  <footer>© PicCube · Contact Piccubemail@gmail.com</footer>
</body>
</html>
